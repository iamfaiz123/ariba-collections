<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=block" rel="stylesheet">
<style>
  body { margin: 0; background: #ddd; font-family: Inter, sans-serif; }
  .card { width: 1000px; height: 560px; display: grid; place-items: center; position: relative; overflow: hidden; }
  .light { --ink: #6E0F1C; --accent: #B8894D; --soft: #6E0F1C99; background: #F7F2EC; }
  .dark  { --ink: #E3C48F; --accent: #E3C48F; --soft: #E3C48F99; background: #231710; }
  .clear-maroon { --ink: #6E0F1C; --accent: #B8894D; --soft: #6E0F1C99; background: transparent; }
  .clear-gold { --ink: #D8B67E; --accent: #D8B67E; --soft: #D8B67EAA; background: transparent; }
  .maroon{ --ink: #F6CCD4; --accent: #E3C48F; --soft: #F6CCD4AA; background: #6E0F1C; }
  .tag { font: 600 15px/1 Inter, sans-serif; letter-spacing: .42em; color: var(--soft); text-transform: uppercase; }

  /* 1 — Heritage wordmark */
  .l1 .word { font: 700 150px/1 Oswald, sans-serif; letter-spacing: .14em; color: var(--ink); margin-right: -.14em; }
  .l1 .rule { display: flex; align-items: center; gap: 18px; margin-top: 26px; justify-content: center; }
  .l1 .rule i { width: 90px; height: 1.5px; background: var(--accent); }
  .l1 .rule b { width: 8px; height: 8px; background: var(--accent); transform: rotate(45deg); }

  /* 2 — Script signature */
  .l2 .word { font: 400 190px/1 "Pinyon Script", cursive; color: var(--ink); padding: 0 30px; }
  .l2 .tag { text-align: center; margin-top: 4px; }

  /* 4 — Arch */
  .l4 .word { font: 600 58px/1 Oswald, sans-serif; letter-spacing: .5em; margin-right: -.5em; color: var(--ink); margin-top: 22px; text-align: center; }

  /* 5 — Needle */
  .l5 .row { display: flex; align-items: flex-end; font: 500 150px/1 "Cormorant Garamond", serif; letter-spacing: .06em; color: var(--ink); }
</style></head>
<body>
<script>
const themes = ['light', 'dark', 'maroon', 'clear-maroon', 'clear-gold'];
const logos = {
  // 1. Bold condensed wordmark, same family as the website header
  '1-heritage-wordmark': () => `
    <div class="l1" style="text-align:center">
      <div class="word">ARIBAS</div>
      <div class="rule"><i></i><b></b><span class="tag">Kurtis &amp; Suits · Est. 2023</span><b></b><i></i></div>
    </div>`,

  // 2. Flowing script like the "Ariba" lettering on the posters, with a thread underline ending in a needle
  '2-script-signature': () => `
    <div class="l2">
      <div class="word">Aribas</div>
      <svg width="560" height="60" viewBox="0 0 560 60" style="display:block;margin:-38px auto 0">
        <path d="M20 30 C 120 52, 220 8, 320 28 S 470 44, 500 26" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>
        <g transform="translate(500 26) rotate(-24)">
          <path d="M0 0 L62 -3.2 L66 0 L62 3.2 Z" fill="var(--accent)"/>
          <ellipse cx="55" cy="0" rx="5" ry="1.3" fill="var(--bg)"/>
        </g>
      </svg>
      <div class="tag" style="margin-top:14px">Handmade detailing</div>
    </div>`,

  // 3. Embroidery hoop monogram: a stamp/badge for labels, tags and the profile picture
  '3-hoop-monogram': () => `
    <svg width="440" height="470" viewBox="-220 -250 440 470">
      <defs><path id="ring" d="M 0 0 m -150 0 a 150 150 0 1 1 300 0 a 150 150 0 1 1 -300 0"/></defs>
      <!-- hoop clamp -->
      <rect x="-16" y="-226" width="32" height="30" rx="4" fill="none" stroke="var(--ink)" stroke-width="5"/>
      <line x1="0" y1="-246" x2="0" y2="-226" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
      <circle r="196" fill="none" stroke="var(--ink)" stroke-width="7"/>
      <circle r="184" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <text transform="rotate(71)" font-family="Inter" font-weight="600" font-size="20" fill="var(--soft)">
        <textPath href="#ring" textLength="930" lengthAdjust="spacing">ARIBAS · HANDMADE DETAILING · EST. 2023 ·</textPath>
      </text>
      <circle r="118" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>
      <text y="62" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="200" fill="var(--ink)">A</text>
    </svg>`,

  // 4. Mughal arch (jharokha) framing the initial, echoing the arches in the posters
  '4-jharokha-arch': () => `
    <div class="l4" style="text-align:center">
      <svg width="210" height="285" viewBox="-105 -165 210 285" style="display:block;margin:0 auto">
        <path d="M-90 110 L-90 -10 C-90 -70 -40 -88 0 -140 C40 -88 90 -70 90 -10 L90 110 Z" fill="none" stroke="var(--accent)" stroke-width="4"/>
        <path d="M-74 110 L-74 -6 C-74 -58 -32 -74 0 -116 C32 -74 74 -58 74 -6 L74 110" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
        <circle cx="0" cy="-152" r="5" fill="var(--accent)"/>
        <text y="88" text-anchor="middle" font-family="Cormorant Garamond" font-weight="500" font-size="170" fill="var(--ink)">A</text>
      </svg>
      <div class="word">ARIBAS</div>
    </div>`,

  // 5. Needle & thread: the "I" is a needle, its thread loops under the name
  '5-needle-and-thread': () => `
    <div class="l5" style="text-align:center">
      <div class="row">
        <span>AR</span>
        <svg width="34" height="150" viewBox="0 0 34 150" overflow="visible" style="margin:0 8px 14px;overflow:visible">
          <path d="M17 18 C 34 40, 40 130, -30 168 C -110 206, -270 196, -250 172 C -230 150, -80 178, 110 186 C 240 191, 360 182, 420 166" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
          <path d="M17 4 C21 4 22 10 22 16 L19.5 146 L17 150 L14.5 146 L12 16 C12 10 13 4 17 4 Z" fill="var(--ink)"/>
          <ellipse cx="17" cy="18" rx="2.2" ry="8" fill="var(--bg)"/>
        </svg>
        <span>BAS</span>
      </div>
      <div class="tag" style="margin-top:56px">Our own designs · Est. 2023</div>
    </div>`,
};
const bg = { light: '#F7F2EC', dark: '#231710', maroon: '#6E0F1C', 'clear-maroon': '#F7F2EC', 'clear-gold': '#231710' };
for (const [name, fn] of Object.entries(logos)) for (const t of themes) {
  const d = document.createElement('div');
  d.className = `card ${t}`; d.id = `${name}--${t}`; d.style.setProperty('--bg', bg[t]);
  d.innerHTML = fn(); document.body.appendChild(d);
}
</script>
</body></html>
