# Render Blueprint — static site with SPA routing
services:
  - type: web
    runtime: static
    name: ariba-collections
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    # Prerendered pages live at <route>/index.html; Render doesn't map a folder to its index.html,
    # so each prerendered route is rewritten explicitly. Everything else gets the app shell (noindex).
    # List exact paths, not wildcards: a wildcard rewrite to a file that doesn't exist returns a blank
    # 200 page. When real products return, add one line per product: /product/<slug> -> /product/<slug>/index.html
    # Order matters: the catch-all must stay last. Keep in sync with the service's Redirects/Rewrites.
    routes:
      - { type: rewrite, source: /collections/kurtis, destination: /collections/kurtis/index.html }
      - { type: rewrite, source: /collections/kurta-sets, destination: /collections/kurta-sets/index.html }
      - { type: rewrite, source: /collections/anarkali, destination: /collections/anarkali/index.html }
      - { type: rewrite, source: /collections/palazzo, destination: /collections/palazzo/index.html }
      - { type: rewrite, source: /collections/patiala, destination: /collections/patiala/index.html }
      - { type: rewrite, source: /collections/sharara, destination: /collections/sharara/index.html }
      - { type: rewrite, source: /collections/straight, destination: /collections/straight/index.html }
      - { type: rewrite, source: /collections/unstitched, destination: /collections/unstitched/index.html }
      - { type: rewrite, source: /shop, destination: /shop/index.html }
      - { type: rewrite, source: /about, destination: /about/index.html }
      - { type: rewrite, source: /contact, destination: /contact/index.html }
      - { type: rewrite, source: /faq, destination: /faq/index.html }
      - { type: rewrite, source: /*, destination: /200.html }
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /media/*
        name: Cache-Control
        value: public, max-age=604800
